name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          title: "build: release"
          commit: "build: release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed for the very first publish, before the packages exist on npm
          # and trusted publishing can be configured. Delete the secret afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
